<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timberline Command</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="hud-top">
      <div class="brand">
        <span class="brand-kicker">RTS / ACTION PROTOTYPE</span>
        <h1>Timberline Command</h1>
      </div>
      <div class="resource-panel">
        <span>Wood</span>
        <strong id="woodCount">0</strong>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="controls-panel">
        <button id="buildBarracksBtn">Build Barracks (100 wood)</button>
        <button id="trainSoldierBtn" class="hidden">Train Soldier (50 wood)</button>
      </div>

      <div class="status-panel">
        <div id="statusText">Walk near a tree and press E to harvest wood.</div>
      </div>
    </div>

    <div class="ability-bar">
      <div id="slashAbility" class="ability-chip ready">
        <div class="ability-icon">F</div>
        <div class="ability-copy">
          <span id="abilityName">Choose Class</span>
          <strong id="slashCooldownText">Ready</strong>
        </div>
      </div>
    </div>
  </div>

  <div id="characterSelect" class="start-screen">
    <div class="start-panel">
      <span class="start-kicker">Choose Your Hero</span>
      <h2>Pick a character before the match starts</h2>
      <div class="class-grid">
        <button class="class-card" data-class="swordsman">
          <img class="class-portrait hidden" alt="Swordsman portrait">
          <strong>Swordsman</strong>
          <span>F: Slash</span>
        </button>
        <button class="class-card" data-class="soldier">
          <img class="class-portrait hidden" alt="Soldier portrait">
          <strong>Soldier</strong>
          <span>F: Burst Shot</span>
        </button>
        <button class="class-card" data-class="mage">
          <img class="class-portrait hidden" alt="Mage portrait">
          <strong>Mage</strong>
          <span>F: Arcane Nova</span>
        </button>
        <button class="class-card" data-class="robot">
          <img class="class-portrait hidden" alt="Robot portrait">
          <strong>Robot</strong>
          <span>F: Pulse Wave</span>
        </button>
      </div>
    </div>
  </div>

  <div id="overlayMessage" class="overlay hidden"></div>

  <script src="game.js"></script>
</body>
</html>
